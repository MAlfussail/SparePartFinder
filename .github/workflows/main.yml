name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Gradle scaffolding & preserve custom source
        run: |
          if [ -d "spare_parts_android_app" ] && [ ! -f "pubspec.yaml" ]; then
            cp -r spare_parts_android_app/* .
          fi
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak
          flutter create --platforms=android --org com.spareparts --project-name spare_parts_ai_matcher .
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spare-parts-ai-matcher-apk
          path: build/app/outputs/flutter-apk/app-release.apk
